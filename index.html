      <div style="font-family: system-ui, -apple-system, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; line-height: 1.6; color: #1f2937;">
        <h1 style="color: #2563eb; font-size: 1.8rem; margin-bottom: 1rem;">Chillán Reporta — Estado de las Calles</h1>
        <p>
          <strong>Chillán Reporta</strong> es una plataforma ciudadana y colaborativa en tiempo real para visualizar y reportar el estado de las vías de tránsito en la <strong>Región de Ñuble, Chile</strong>.
        </p>
        <h2 style="font-size: 1.3rem; margin-top: 1.5rem; margin-bottom: 0.5rem;">¿Qué puedes consultar y reportar?</h2>
        <ul>
          <li><strong>Baches y daños en el pavimento:</strong> Ubicación geográfica exacta y nivel de peligro vial (alto, medio, bajo).</li>
          <li><strong>Cortes de calle:</strong> Faenas viales, desvíos y cierres temporales de tránsito.</li>
          <li><strong>Validación comunitaria:</strong> Confirmaciones vecinales y estado de intervención o reparación en vivo.</li>
        </ul>
        <h2 style="font-size: 1.3rem; margin-top: 1.5rem; margin-bottom: 0.5rem;">Cobertura geográfica</h2>
        <p>
          Disponible para Chillán, Chillán Viejo y las comunas de la Región de Ñuble (Bulnes, San Carlos, Coihueco, Quillón, Pinto, entre otras).
        </p>
        <p style="margin-top: 1.5rem; padding: 1rem; background-color: #f3f4f6; border-radius: 0.5rem;">
          <em>Nota: Para interactuar con el mapa en vivo y registrar reportes viales, por favor activa JavaScript en tu navegador.</em>
